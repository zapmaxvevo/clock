name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:unit
      # El módulo de tiempo de nuevo, con el proceso en un huso negativo: una
      # dependencia de la zona de la máquina no se nota con el proceso en UTC.
      - run: npm run test:time-ar
      - run: npm run build
        env:
          # Valores de relleno: el build no se conecta a nada, solo valida el
          # esquema de entorno.
          DATABASE_URL: postgresql://user:pass@localhost:5432/clock
          BETTER_AUTH_SECRET: ci-secret-de-al-menos-32-caracteres-xx
          BETTER_AUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: ci
          GOOGLE_CLIENT_SECRET: ci
          GOOGLE_WORKSPACE_DOMAINS: ejemplo.com
          WORKSPACE_OWNER_EMAIL: owner@ejemplo.com
          CRON_SECRET: ci-cron-secret-largo
      - run: npm audit --omit=dev --audit-level=high

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: clock
          POSTGRES_PASSWORD: clock
          POSTGRES_DB: clock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://clock:clock@localhost:5432/clock_test

  e2e:
    runs-on: ubuntu-latest
    needs: [verify, integration]
    # Corre contra un servidor local, no contra el preview de Vercel: sin
    # E2E_BASE_URL, playwright.config.ts compila y levanta la aplicación con
    # sus valores de desarrollo y genera el secreto de la sesión de prueba.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: clock
          POSTGRES_PASSWORD: clock
          POSTGRES_DB: clock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # La misma base que LOCAL_DATABASE_URL de e2e/environment.ts.
      DATABASE_URL: postgresql://clock:clock@localhost:5432/clock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Las trazas de los reintentos, para abrir con `npx playwright show-trace`.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
