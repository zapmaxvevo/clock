name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Valores de relleno: el build no se conecta a nada, solo valida el
          # esquema de entorno.
          DATABASE_URL: postgresql://user:pass@localhost:5432/clock
          BETTER_AUTH_SECRET: ci-secret-de-al-menos-32-caracteres-xx
          BETTER_AUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: ci
          GOOGLE_CLIENT_SECRET: ci
          GOOGLE_WORKSPACE_DOMAINS: ejemplo.com
          WORKSPACE_OWNER_EMAIL: owner@ejemplo.com
          CRON_SECRET: ci-cron-secret-largo
      - run: npm audit --omit=dev --audit-level=high

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: clock
          POSTGRES_PASSWORD: clock
          POSTGRES_DB: clock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://clock:clock@localhost:5432/clock_test

  e2e:
    runs-on: ubuntu-latest
    needs: [verify, integration]
    # Los secretos de e2e viven en este environment y no a nivel repositorio:
    # E2E_DATABASE_URL escribe en la base del preview.
    environment: preview
    if: vars.E2E_BASE_URL != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          # El endpoint de sesión de prueba solo se registra con este secreto
          # cargado. Tiene que coincidir con el del entorno de preview.
          E2E_TEST_SESSION_SECRET: ${{ secrets.E2E_TEST_SESSION_SECRET }}
          # Opt-in explícito del endpoint de sesión de prueba. Sin esta
          # variable no se registra, aunque el secreto esté cargado.
          ALLOW_TEST_SESSION: "true"
          # El setup de Playwright atrasa la creación del workspace en la base
          # del preview, que lleva solo datos sintéticos.
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
